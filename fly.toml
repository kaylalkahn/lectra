# Fly.io: `fly launch --no-deploy --copy-config`, `fly volumes create lectra_data --size 3`, `fly deploy`
app = "lectra"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"
  TRUST_PROXY = "1"

[mounts]
  source = "lectra_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.checks]
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
