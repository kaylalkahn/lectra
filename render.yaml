# Render blueprint. The free plan has an EPHEMERAL disk: accounts and recordings reset when the service
# restarts or sleeps. Fine for a quick demo. For persistence use a paid plan and uncomment the disk.
services:
  - type: web
    name: lectra
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - { key: PORT, value: "8080" }
      - { key: DATA_DIR, value: /data }
      - { key: COOKIE_SECURE, value: "1" }
      - { key: TRUST_PROXY, value: "1" }
    # disk:
    #   name: lectra-data
    #   mountPath: /data
    #   sizeGB: 5
